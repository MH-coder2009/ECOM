{% load tailwind_tags %}
<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}فروشگاه مدرن{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    {% tailwind_css %}
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col transition-colors duration-300">

    {% include 'partials/header.html' %}

    <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        {% block content %}{% endblock %}
    </main>

    {% include 'partials/footer.html' %}

    <script>
        // Theme toggle
        const html = document.documentElement;
        const btn = document.getElementById('themeToggle');
        const saved = localStorage.getItem('theme') || 'light';
        if (saved === 'dark') html.classList.add('dark');
        updateIcon(saved);

        function updateIcon(theme) {
            if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        if (btn) {
            btn.addEventListener('click', () => {
                html.classList.toggle('dark');
                const isDark = html.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                updateIcon(isDark ? 'dark' : 'light');
            });
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
